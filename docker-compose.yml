services:
  covertlens:
    build:
      context: .
      args:
        GIT_SHA: local
    image: covertlens:local
    ports:
      - "8000:8000"
    environment:
      COVERTLENS_WORKERS: "4"
      # Demo only: trusts X-Demo-Role from any client (CL-78).
      COVERTLENS_DEMO_ROLES: "on"
    volumes:
      - covertlens-data:/data

volumes:
  covertlens-data:
