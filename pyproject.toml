[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "covertlens"
version = "0.1.0"
description = "CovertLens: inline steganalysis gate designed for multi-agent evaluation harnesses — four-family image scoring, verdict ladder, audited evidence"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Agent Evaluation / AI Safety" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
web = ["fastapi>=0.115", "uvicorn>=0.34", "python-multipart>=0.0.20", "httpx>=0.28"]

[project.scripts]
covertlens = "covertlens.cli:main"

[tool.setuptools.packages.find]
include = ["covertlens*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
