[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "covertlens"
version = "0.1.0"
description = "CovertLens: inline steganalysis gate designed for multi-agent evaluation harnesses — four-family image scoring, verdict ladder, audited evidence"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Agent Evaluation / AI Safety" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11", "mypy>=1.15", "jsonschema>=4.23"]
web = ["fastapi>=0.115", "uvicorn>=0.34", "python-multipart>=0.0.20", "httpx>=0.28"]

[project.scripts]
covertlens = "covertlens.cli:main"

[tool.setuptools.packages.find]
include = ["covertlens*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: wall-clock or otherwise slow tests; excluded from the required CI run (CL-50)",
]

# Lint + format gate (CL-50). Rule families are exactly the
# mechanical classes in scope: pycodestyle errors, pyflakes,
# import order, and pyupgrade (deprecated typing, datetime.UTC).
[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

# Type gate (CL-50): `mypy covertlens` must report 0 errors.
[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
