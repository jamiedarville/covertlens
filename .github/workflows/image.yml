name: image

# Build-image job (CL-47): on version tags, build the image, run
# the library tests inside it, smoke health + one analyze, then
# publish to GHCR. Tag pushes only — fork pull requests never
# reach this workflow (and the test workflow already excludes
# self-hosted runs for forks).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build test image and run the library tests inside it
        run: |
          docker build --target test -t covertlens-test .
          docker run --rm covertlens-test

      - name: Build runtime image
        run: |
          docker build \
            --build-arg GIT_SHA=${{ github.sha }} \
            -t covertlens:${{ github.ref_name }} .

      - name: Smoke the runtime image (health + one analyze)
        run: |
          docker run -d --name covertlens-smoke -p 8000:8000 \
            covertlens:${{ github.ref_name }}
          for i in $(seq 1 30); do
            curl -fs http://127.0.0.1:8000/api/health && break || sleep 1
          done
          curl -fs http://127.0.0.1:8000/api/health | grep -q '"status":"ok"'
          test "$(docker exec covertlens-smoke id -un)" != "root"
          PYTHONPATH=. python3 -c "
          from covertlens.geometric_fixtures import build_geo_pair
          _c, enc = build_geo_pair('height_position')
          open('/tmp/fixture.png', 'wb').write(enc.data)
          "
          curl -fs -F file=@/tmp/fixture.png http://127.0.0.1:8000/api/analyze \
            | grep -q '"geometric"'
          docker rm -f covertlens-smoke

      - name: Publish to GHCR (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" --password-stdin
          docker tag covertlens:${{ github.ref_name }} \
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          docker push ghcr.io/${{ github.repository }}:${{ github.ref_name }}
