name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    # The repository is public, so a pull request from a fork must never
    # run on the self-hosted runner (it would execute untrusted code on
    # the maintainer's machine). Fork PRs use a GitHub-hosted runner;
    # pushes to main and same-repository PRs use the self-hosted one.
    runs-on: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && fromJSON('["ubuntu-latest"]') || fromJSON('["self-hosted", "Linux", "X64"]') }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Later steps never push, so do not leave a token on disk.
          persist-credentials: false

      - name: Check host Python version
        run: |
          python3 --version
          python3 -c 'import sys; assert (3, 11) <= sys.version_info[:2] < (3, 15), "unsupported Python " + sys.version'

      # No actions/setup-python: it has no build for this host's
      # distro (CachyOS), so use the host Python (>= 3.11 per
      # pyproject) in a per-job virtualenv instead.
      - name: Create virtualenv (host Python)
        run: |
          python3 -m venv .venv
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Install dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run test suite
        run: python -m pytest -q

      - name: Contract smoke checks
        run: |
          python -m covertlens validate-manifest
          python -m covertlens validate-runtime
          python -m covertlens parse-demo > /dev/null
          python -m covertlens lsb-demo > /dev/null
          python -m covertlens benchmark-lsb > /dev/null
          python -m covertlens dct-demo > /dev/null
          python -m covertlens benchmark-dct > /dev/null
          python -m covertlens trace-demo > /dev/null
          python -m covertlens verdict-demo > /dev/null
          python -m covertlens replay-demo > /dev/null
          python -m covertlens metadata-demo > /dev/null
          python -m covertlens sequence-demo > /dev/null
          python -m covertlens report-demo > /dev/null
          python -m covertlens pinning-demo > /dev/null
          python -m covertlens calibrate-demo > /dev/null
          python -m covertlens frozen-demo > /dev/null
          python -m covertlens latency-demo > /dev/null
          python -m covertlens pilot-demo > /dev/null
          python -m covertlens ablation-demo > /dev/null
          python -m covertlens route-audit-demo > /dev/null
          python -m covertlens export-demo > /dev/null
          python -m covertlens robustness-demo > /dev/null
          python -m covertlens scorecard-demo > /dev/null
          python -m covertlens handoff-demo > /dev/null
          python -m covertlens geo-fixtures-demo > /dev/null
          python -m covertlens segmentation-demo > /dev/null
          python -m covertlens geometric-demo > /dev/null
          python -m covertlens vector-demo > /dev/null
          python -m covertlens geo-benchmark-demo > /dev/null
